name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here needs write access, and nothing here needs a secret.
permissions:
  contents: read

env:
  # Keep in step with docs/development/toolchain.md.
  LLVM_VERSION: "22"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA, not by tag: a tag can be moved.
jobs:
  # Fast gate: proves game logic, runtime and the whole test suite build and pass
  # with the desktop backend and SDL absent entirely.
  core:
    name: Core (Linux, clang, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ci-core -DWUMPO_SANITIZE="address;undefined"

      - name: Build
        run: cmake --build --preset ci-core

      - name: Test
        run: ctest --preset ci-core

  # Full build including the SDL3 backend, on the platform development happens on.
  # Driven through scripts/dev.ps1 so CI exercises the same entry point a
  # developer uses, and a break in the script is caught here rather than locally.
  windows:
    name: Full (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read pinned SDL tag
        id: sdl
        shell: bash
        run: |
          tag=$(grep -oP 'WUMPO_SDL_TAG "\K[^"]+' cmake/WumpoDependencies.cmake)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # SDL3 is built from source once and reused; the key changes with the tag.
      - name: Cache SDL3 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/debug/_deps
          key: sdl3-${{ runner.os }}-${{ steps.sdl.outputs.tag }}

      - name: Configure
        shell: pwsh
        run: .\scripts\dev.ps1 configure -Preset debug -DWUMPO_WERROR=ON

      - name: Build
        shell: pwsh
        run: .\scripts\dev.ps1 build -Preset debug

      - name: Test
        shell: pwsh
        run: .\scripts\dev.ps1 test -Preset debug

  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned to the same major version developers install locally. clang-format
      # output differs between releases, so an unpinned version turns a green
      # local check into a red CI run over formatting nobody chose.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y clang-format-${{ env.LLVM_VERSION }} clang-tidy-${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang-format clang-format             /usr/bin/clang-format-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy             /usr/bin/clang-tidy-${{ env.LLVM_VERSION }} 100
          clang-format --version

      - name: Check formatting
        run: |
          files=$(find src emulator tests -name '*.cpp' -o -name '*.hpp' \
                  | grep -v 'third_party' || true)
          if [ -z "$files" ]; then echo "found no sources to check"; exit 1; fi
          clang-format --dry-run --Werror $files

      # clang-tidy needs a compilation database, so configure first. The core
      # preset is enough: it covers everything except the SDL backend, which
      # cannot be linted on a runner without SDL headers anyway.
      - name: Configure for lint
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ci-core

      - name: Run clang-tidy
        run: |
          files=$(python3 tools/list_compiled_sources.py build/ci-core)
          echo "$files"
          clang-tidy -p build/ci-core --warnings-as-errors='*' $files
